<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>资金盈亏 · 数据看板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      margin: 0;
    }

    .dashboard {
      max-width: 750px;
      width: 100%;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15), 0 4px 18px rgba(0,20,40,0.08);
      border-radius: 2.5rem;
      padding: 2.2rem 2rem 2.5rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.6);
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
      color: #0b1c2e;
      margin-bottom: 1.8rem;
      border-bottom: 2px solid #e9eff4;
      padding-bottom: 1.2rem;
    }
    h1 span {
      background: #1e2b3c;
      color: white;
      font-size: 1rem;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
      margin-left: 0.5rem;
      font-weight: 500;
      background: #2c3e50;
    }

    .total-card {
      background: #0f1a2b;
      background: linear-gradient(135deg, #132237 0%, #1c2c42 100%);
      border-radius: 1.8rem;
      padding: 1.8rem 2rem;
      margin-bottom: 2.2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      color: white;
      box-shadow: 0 18px 30px -10px rgba(15, 25, 45, 0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .total-label {
      font-size: 1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.7;
      margin-bottom: 0.4rem;
    }

    .total-amount {
      font-size: 2.9rem;
      font-weight: 700;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      color: #f0f6ff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .currency {
      font-size: 1.8rem;
      font-weight: 400;
      opacity: 0.8;
      margin-right: 0.2rem;
    }

    .avg-badge {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 2.5rem;
      padding: 0.7rem 1.7rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
    }

    .avg-label {
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.7;
    }

    .avg-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .avg-value.positive {
      color: #7cd992;
    }
    .avg-value.negative {
      color: #f4a0a0;
    }

    .table-wrapper {
      background: #f9fcff;
      border-radius: 1.5rem;
      padding: 0.1rem 0;
      overflow-x: auto;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
      background: #ffffff;
      border: 1px solid #edf2f9;
      margin-top: 0.4rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 0.95rem;
      min-width: 400px;
    }

    th {
      text-align: left;
      padding: 1.1rem 1.2rem 0.9rem 1.4rem;
      font-weight: 600;
      color: #3e4a5a;
      font-size: 0.8rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: #f7fafd;
      border-bottom: 2px solid #e2e8f0;
    }

    td {
      padding: 1rem 1.2rem 1rem 1.4rem;
      border-bottom: 1px solid #edf2f7;
      color: #1e293b;
      font-weight: 500;
    }

    tbody tr:hover {
      background: #f2f6fd;
      transition: background 0.15s;
    }

    .profit-positive {
      color: #0f6e3f;
      font-weight: 600;
      background: #e3f5ea;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      display: inline-block;
    }

    .profit-negative {
      color: #b23b3b;
      font-weight: 600;
      background: #ffeae9;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      display: inline-block;
    }

    .date-cell {
      font-weight: 500;
      color: #1e2a36;
      background: transparent;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #62748c;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
      letter-spacing: 0.2px;
    }

    .error-state {
      background: #fff5f5;
      border-radius: 1.5rem;
      padding: 2rem;
      text-align: center;
      color: #b91c1c;
      font-weight: 500;
    }

    @media (max-width: 500px) {
      .dashboard {
        padding: 1.5rem 1.2rem;
      }
      .total-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .avg-badge {
        align-items: flex-start;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>
      📊 资金概览
      <span>实时</span>
    </h1>

    <!-- 总资金卡片动态渲染 -->
    <div id="totalFundDisplay" class="total-card">
      <!-- JS填充 -->
    </div>

    <!-- 表格区域 -->
    <div class="table-wrapper">
      <table id="profitTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>盈亏 (¥)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- 动态注入行数据 -->
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      <span>📋 基于日期盈亏计算平均值</span>
    </div>
  </div>

  <script>
    (async function loadData() {
      const totalFundContainer = document.getElementById('totalFundDisplay');
      const tableBody = document.getElementById('tableBody');

      try {
        // 请求同目录下的 data.json 文件
        const response = await fetch('./data.json');
        
        if (!response.ok) {
          throw new Error(`无法加载数据 (状态: ${response.status})`);
        }

        const data = await response.json();

        // 基础校验：需要总资金字段和日期盈亏数组
        if (typeof data.总资金 === 'undefined' || !Array.isArray(data.date盈亏)) {
          throw new Error('data.json 格式错误：需要包含 "总资金" 和 "date盈亏" 数组');
        }

        const totalFund = Number(data.总资金);
        const profitRecords = data.date盈亏; // 数组元素预期格式: { date: "2025-03-01", profit: 1234.56 }

        if (profitRecords.length === 0) {
          // 无记录时展示信息
          totalFundContainer.innerHTML = `
            <div>
              <div class="total-label">总资金</div>
              <div class="total-amount"><span class="currency">¥</span>${totalFund.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
            </div>
            <div class="avg-badge">
              <span class="avg-label">平均盈亏</span>
              <span class="avg-value">—</span>
            </div>
          `;
          tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding:2.5rem; color:#64748b;">暂无日期盈亏数据</td></tr>`;
          return;
        }

        // 计算总盈亏与平均盈亏（基于所有记录的 profit 字段）
        let totalProfitSum = 0;
        const validRecords = [];

        for (let record of profitRecords) {
          // 确保 record 包含 date 和 profit 属性
          if (record && typeof record.date !== 'undefined' && typeof record.profit !== 'undefined') {
            const profitValue = Number(record.profit);
            if (!isNaN(profitValue)) {
              totalProfitSum += profitValue;
              validRecords.push({
                date: String(record.date),
                profit: profitValue
              });
            } else {
              console.warn('忽略无效profit记录:', record);
            }
          } else {
            console.warn('记录缺少date或profit字段:', record);
          }
        }

        const recordCount = validRecords.length;
        const averageProfit = recordCount > 0 ? totalProfitSum / recordCount : 0;

        // 渲染总资金卡片（包含平均盈亏）
        renderTotalFundCard(totalFund, averageProfit, recordCount);

        // 渲染表格
        renderProfitTable(validRecords);

      } catch (error) {
        console.error('数据加载或解析失败:', error);
        totalFundContainer.innerHTML = `<div class="error-state">⚠️ 数据加载失败：${error.message}</div>`;
        tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding:2rem; color:#b91c1c;">无法显示表格</td></tr>`;
      }
    })();

    function renderTotalFundCard(totalFund, averageProfit, count) {
      const container = document.getElementById('totalFundDisplay');
      
      const formattedTotal = totalFund.toLocaleString('zh-CN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      // 平均盈亏保留两位小数，并判断正负以应用样式
      const avgFixed = averageProfit.toFixed(2);
      const avgNum = parseFloat(avgFixed);
      const avgClass = avgNum > 0 ? 'positive' : (avgNum < 0 ? 'negative' : '');
      
      // 格式化平均盈亏显示（带符号）
      const formattedAvg = avgNum >= 0 ? `+${avgFixed}` : avgFixed;

      container.innerHTML = `
        <div>
          <div class="total-label">总资金</div>
          <div class="total-amount">
            <span class="currency">¥</span>${formattedTotal}
          </div>
        </div>
        <div class="avg-badge">
          <span class="avg-label">平均盈亏 · ${count}条记录</span>
          <span class="avg-value ${avgClass}">${formattedAvg}</span>
        </div>
      `;
    }

    function renderProfitTable(records) {
      const tableBody = document.getElementById('tableBody');
      
      if (!records || records.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; padding:2rem; color:#64748b;">暂无有效盈亏记录</td></tr>`;
        return;
      }

      // 按日期排序（可选，便于阅读），尝试将日期字符串转为可比较格式
      const sortedRecords = [...records].sort((a, b) => {
        // 简单字符串比较，或尝试日期解析；这里使用默认字符串排序（若日期格式为YYYY-MM-DD则有效）
        return a.date.localeCompare(b.date);
      });

      let htmlRows = '';
      for (let rec of sortedRecords) {
        const profitValue = rec.profit;
        const profitFixed = profitValue.toFixed(2);
        // 根据正负设置样式类
        const profitClass = profitValue > 0 ? 'profit-positive' : (profitValue < 0 ? 'profit-negative' : '');
        // 显示带符号的盈亏
        const sign = profitValue > 0 ? '+' : '';
        const displayProfit = `${sign}${profitFixed}`;
        
        // 日期格式化展示（保留原始字符串，也可美化）
        const dateDisplay = rec.date;

        htmlRows += `
          <tr>
            <td class="date-cell">📅 ${escapeHTML(dateDisplay)}</td>
            <td><span class="${profitClass}">${escapeHTML(displayProfit)}</span></td>
          </tr>
        `;
      }

      tableBody.innerHTML = htmlRows;
    }

    // 简单防XSS转义函数（用于用户可能修改的data.json内容）
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
