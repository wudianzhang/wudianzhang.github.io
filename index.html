<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<script>
// 你自定义的JSON数据
const myJson = {
  time: new Date().toISOString(),
  name: "wudianzhang",
  status: "online",
  data: [11,22,33]
};

// 把JSON打印到控制台 F12 可查看
console.log("当前JSON数据：", myJson);

// 可选：自动下载JSON到本地
function downloadJson() {
  const blob = new Blob([JSON.stringify(myJson, null, 2)], {
    type: "application/json"
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "data.json";
  // a.click(); // 取消注释打开页面自动下载
}

// downloadJson();
</script>
</body>
</html>
