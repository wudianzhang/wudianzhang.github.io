<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吴店长程序站 - 工具库</title>
    <link rel="stylesheet" href="../../home-styles.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-nav">
        <div class="nav-container">
            <div class="nav-left">
                <nav class="nav-menu">
                    <a href="../../index.html" class="nav-item">首页</a>
                    <a href="#" class="nav-item active">工具库</a>
                    <a href="../docs/index.html" class="nav-item">文档</a>
                </nav>
            </div>
            <div class="nav-center">
                <div class="search-wrapper">
                    <svg class="search-icon-svg" viewBox="0 0 20 20" width="16" height="16">
                        <path d="M14.386 14.386l4.0877 4.0877-1.295 1.295-4.0877-4.0877C12.006 16.54 10.568 17 9 17c-4.4183 0-8-3.5817-8-8s3.5817-8 8-8 8 3.5817 8 8c0 1.568-.46 3.006-1.295 4.086z" fill="currentColor"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜索工具名称、描述或标签...">
                    <button class="search-btn" onclick="performSearch()">搜索</button>
                </div>
            </div>
            <div class="nav-right">
                <a href="https://space.bilibili.com/1561008" target="_blank" class="nav-item">B站</a>
            </div>
        </div>
    </header>

    <!-- 主布局 -->
    <div class="main-layout">
        <!-- 左侧分类导航 -->
        <aside class="sidebar">
            <div class="sidebar-title">分类</div>
            <div class="category-list" id="categoryList"></div>
        </aside>

        <!-- 右侧内容区 -->
        <main class="content-area">
            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-sort="default">综合排序</button>
                    <button class="filter-tab" data-sort="downloads">热度</button>
                    <button class="filter-tab" data-sort="newest">最新发布</button>
                </div>
                <div class="total-stats" id="totalStats"></div>
            </div>

            <!-- 工具列表 -->
            <div class="tools-list" id="toolsList"></div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#c0c4cc" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <p class="empty-text">未找到匹配的工具</p>
                <button class="btn-reset" onclick="resetFilters()">清除筛选</button>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="../../home-script.js?v=6"></script>
    <script>
        // 指定数据路径
        window.TOOLS_DATA_PATH = 'tools.json';
    </script>
</body>
</html>
