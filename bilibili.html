<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站主页 - 天梯排行</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f4f4f4;
            height: 100vh;
            overflow: hidden;
        }
        
        .proxy-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(135deg, #fb7299, #fc8bab);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-2px);
        }
        
        .page-title {
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .external-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        
        .external-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .iframe-container {
            margin-top: 50px;
            height: calc(100vh - 50px);
            width: 100%;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(251, 114, 153, 0.2);
            border-top-color: #fb7299;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="proxy-header">
        <a href="/" class="back-btn">← 返回首页</a>
        <div class="page-title">
            <span>📺</span>
            <span>B站主页</span>
        </div>
        <a href="https://space.bilibili.com/1561008?" target="_blank" class="external-link">
            在新窗口打开 ↗
        </a>
    </div>
    
    <div class="iframe-container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">正在加载 B站主页...</div>
        </div>
        <iframe 
            src="https://space.bilibili.com/1561008?" 
            onload="document.getElementById('loading').style.display='none'"
            onerror="showError()"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
        ></iframe>
    </div>
    
    <script>
        function showError() {
            const loading = document.getElementById('loading');
            loading.innerHTML = `
                <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                <div style="color: #666; font-size: 16px; margin-bottom: 16px;">
                    由于浏览器安全限制，无法直接嵌入B站页面
                </div>
                <a href="https://space.bilibili.com/1561008?" 
                   target="_blank" 
                   style="display: inline-block; padding: 12px 24px; background: #fb7299; color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">
                    点击这里访问 B站主页 →
                </a>
            `;
        }
        
        // 5秒后如果还在加载，显示提示
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading.style.display !== 'none') {
                showError();
            }
        }, 5000);
    </script>
</body>
</html>
